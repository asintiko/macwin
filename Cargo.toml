[workspace]
members = ["crates/*", "tools/keymap-gen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
# `license` is intentionally unset: the project's own license is an open decision.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
# Releases ship without symbols or debug info (macwin.exe had 38 MB of them).
strip = true
# `panic` stays `unwind`: FFI callbacks rely on `catch_unwind`.

[workspace.dependencies]
# Internal crates.
macwin-core = { path = "crates/macwin-core" }
macwin-proto = { path = "crates/macwin-proto" }
macwin-net = { path = "crates/macwin-net" }
macwin-platform = { path = "crates/macwin-platform" }
macwin-platform-macos = { path = "crates/macwin-platform-macos" }
macwin-platform-windows = { path = "crates/macwin-platform-windows" }
macwin-ui = { path = "crates/macwin-ui" }

# Third-party crates: exact pins (design.md §3); Cargo.lock is checked in.
prost = "=0.14.4"
bytes = "=1.12.1"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "=0.17.14"
spake2 = "=0.4.0"
png = "=0.18.1"
libc = "=0.2.190"
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDate",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGGeometry",
    "CGRemoteOperation",
    "CGDisplayConfiguration",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSGraphics",
    "NSWorkspace",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSAppleEventManager",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSURL",
    "NSValue",
] }
security-framework = { version = "=3.7.0", default-features = false }
# GUI: OpenGL (glow) renderer and the bundled fonts only; X11 serves Linux
# development builds. winit is a direct dependency only for its macOS
# extension traits and stays in lock-step with the version eframe resolves.
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "x11"] }
winit = { version = "=0.30.13", default-features = false }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Dev-only.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
