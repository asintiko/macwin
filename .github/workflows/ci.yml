name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      # rust-toolchain.toml pins 1.96.0; install it explicitly with the components CI needs.
      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal -c rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Generated keymap is up to date
        run: cargo run -p keymap-gen --locked -- --check

  # Builds the release packages and smoke-tests them: the dmg mounts and holds
  # a validly signed app; the Windows zip installs, updates and uninstalls while
  # preserving unrelated files. The packages stay as artifacts.
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Installer safety regressions
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/windows/tests/installer-scope.ps1
      - name: Build MacWin.app and the dmg
        if: runner.os == 'macOS'
        run: scripts/macos/dmg.sh
      - name: Check the dmg
        if: runner.os == 'macOS'
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" target/MacWin-*.dmg
          test -L "$mnt/Applications"
          test -f "$mnt/First Launch.txt"
          test -x "$mnt/Install MacWin.command"
          test -f "$mnt/MacWin.app/Contents/Resources/AppIcon.icns"
          test -f "$mnt/MacWin.app/Contents/Resources/THIRD_PARTY_NOTICES"
          codesign --verify --strict --verbose=2 "$mnt/MacWin.app"
          "$mnt/MacWin.app/Contents/MacOS/macwin" --version
          hdiutil detach "$mnt"
      - name: Build the zip
        if: runner.os == 'Windows'
        shell: bash
        env:
          MACWIN_WINDOWS_TARGET: x86_64-pc-windows-msvc
        run: scripts/windows/package.sh
      - name: Install, check and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          # A user PATH like the one Windows creates: REG_EXPAND_SZ with an unexpanded entry.
          $envKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $marker = '%USERPROFILE%\macwin-ci-marker'
          $envKey.SetValue('Path', $marker, [Microsoft.Win32.RegistryValueKind]::ExpandString)
          function Assert-UserPath([bool]$installed) {
            $raw = $envKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $parts = $raw -split ';'
            if ($envKey.GetValueKind('Path') -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw "PATH lost its type: $raw" }
            if ($parts -notcontains $marker) { throw "PATH lost an unexpanded entry: $raw" }
            $expectedCount = if ($installed) { 1 } else { 0 }
            if (@($parts | Where-Object { $_ -eq $dest }).Count -ne $expectedCount) { throw "unexpected PATH: $raw" }
          }
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          Expand-Archive -Path (Get-Item target/macwin-*-windows-x64.zip) -DestinationPath $stage
          $installer = Get-ChildItem $stage -Recurse -Filter install.ps1 | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'macwin custom install'
          & $installer.FullName -Destination "$dest\" -NoStart
          Assert-UserPath $true
          $userFile = Join-Path $dest 'notes.txt'
          Set-Content -LiteralPath $userFile -Value 'keep my file'
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            & $installer.FullName -Destination '.\macwin custom install\' -NoStart
          } finally {
            Pop-Location
          }
          if ((Get-Content -LiteralPath $userFile) -ne 'keep my file') { throw 'update changed an unrelated file' }
          Assert-UserPath $true
          $run = (Get-ItemProperty $runKey).macwin
          if ($run -ne "`"$dest\macwin-tray.exe`" --background") { throw "unexpected Run value: $run" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'MacWin.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne "$dest\macwin-tray.exe") { throw "unexpected Start menu shortcut: $target" }
          if (@(Get-NetFirewallRule -Group 'macwin').Count -ne 2) { throw 'firewall rules missing' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin is required to check package dependencies' }
          foreach ($binary in 'macwin.exe', 'macwin-tray.exe') {
            $imports = & $dumpbin /DEPENDENTS (Join-Path $dest $binary)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
            if ($imports -match '\b(?:vcruntime|msvcp|concrt)\d\S*\.dll\b') {
              throw "$binary requires a separately installed Visual C++ runtime"
            }
          }
          & "$dest\macwin.exe" autostart status
          if ($LASTEXITCODE -ne 0) { throw 'macwin autostart status failed' }
          # From inside the folder it removes, as "Run with PowerShell" starts it.
          $p = Start-Process powershell.exe -WorkingDirectory $dest -Wait -PassThru -NoNewWindow `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$dest\uninstall.ps1`""
          if ($p.ExitCode -ne 0) { throw "uninstall.ps1 failed with exit code $($p.ExitCode)" }
          Assert-UserPath $false
          foreach ($file in 'macwin.exe', 'macwin-tray.exe', 'uninstall.ps1', 'README.txt', 'THIRD_PARTY_NOTICES') {
            if (Test-Path -LiteralPath (Join-Path $dest $file)) { throw "program file left after uninstall: $file" }
          }
          if ((Get-Content -LiteralPath $userFile) -ne 'keep my file') { throw 'uninstall changed an unrelated file' }
          Remove-Item -LiteralPath $userFile
          Remove-Item -LiteralPath $dest
          if ((Get-ItemProperty $runKey).macwin) { throw 'the Run value is left' }
          if (Test-Path -LiteralPath $shortcut) { throw 'the Start menu shortcut is left' }
          if (Get-NetFirewallRule -Group 'macwin' -ErrorAction SilentlyContinue) { throw 'firewall rules are left' }
          $envKey.Close()
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macwin-${{ runner.os }}
          path: |
            target/MacWin-*.dmg
            target/MacWin-*-windows-x64.exe
            target/macwin-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # cargo-deny-action is a Docker action and only runs on Linux; deny.toml's
  # [graph] targets make it check the macOS and Windows dependency graphs.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check
          rust-version: "1.96.0"
